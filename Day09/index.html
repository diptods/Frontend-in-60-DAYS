<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Startup Website</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link rel="stylesheet" href="style.css">

        <style type="text/tailwindcss">
            @theme {
                --color-clifford: #da373d;
              }
        </style>
</head>
<body>
<!-- 1. Navbar  -->
<section id="navbar" class="bg-gray-900 text-white fixed top-0 left-0 w-full z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-row items-center justify-between">
    
    <!-- Logo Container -->
    <div class="flex items-center gap-2">
      <img src="./images/download-removebg-preview.png" alt="SyncFlow" class="w-25 h-15 shrink-0 object-contain">
      <span class="font-bold text-xl tracking-tight text-blue-500"><span class="text-emerald-600">Sync</span>Flow</span>
    </div>
    
    <!-- Navigation Links -->
    <div class="flex flex-row items-center gap-6">
      <a href="#" class="text-gray-300 hover:text-cyan-400 font-medium hover:font-bold transition">Platform</a>
      <a href="#" class="text-gray-300 hover:text-cyan-400 font-medium hover:font-bold transition">Solutions</a>
      <a href="#" class="text-gray-300 hover:text-cyan-400 font-medium hover:font-bold transition">Pricing</a>
      <a href="#" class="text-gray-300 hover:text-cyan-400 font-medium hover:font-bold transition">Company</a>
    </div>
    
    <!-- Action Buttons -->
    <div class="flex items-center gap-4">
      <button type="button" class="bg-green-500 hover:bg-green-600 text-white-300 hover:text-white font-medium transition px-4 py-2 rounded-lg">Log in</button>
      <button type="button" class="bg-cyan-500 hover:bg-cyan-600 text-slate-900 font-semibold px-4 py-2 rounded-lg transition">Get Started</button>
    </div>

  </div>
</section>

<!-- 2. Hero Section -->
<section id="hero" class="min-h-screen w-full flex flex-col items-center justify-center bg-slate-950 bg-[radial-gradient(circle_at_center,var(--tw-gradient-stops))] from-teal-900/40 via-slate-950 to-slate-950 px-4 text-center">
    <div class="max-w-3xl flex flex-col items-center gap-6">
        <h1 class="text-white font-mono  font-bold text-4xl md:text-6xl tracking-wide leading-tight">
          Workflow Automation, <br>
          <span class="text-light-400">Reimagined.</span>
        </h1>
        <p class="text-gray-300 font-mono text-sm md:text-base max-w-xl leading-relaxed tracking-wide">
          SyncFlow connects your tools, streamlines processes, and boosts team productivity by 3x. Zero coding required.
        </p>

        <div class="flex items-center gap-4 mt-4">
          <button class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-semibold px-6 py-3 rounded-lg transition shadow-lg shadow-cyan-500/20">
            Start Free Trial
          </button>
          <button class="text-white hover:text-cyan-400 font-medium px-6 py-3 transition">
            Watch Demo →
          </button>
        </div>

    </div>
    
</section>



</body>
</html>
